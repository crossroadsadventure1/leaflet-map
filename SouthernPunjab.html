<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Fullscreen Plugin CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-fullscreen/1.3.0/leaflet.fullscreen.min.css" />
<!-- Leaflet Fullscreen Plugin JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-fullscreen/1.3.0/leaflet.fullscreen.min.js"></script>

<div id="map" style="width: 100%; height: 2000px;"></div>

<script>
  var map = L.map('map').setView([30.0, 70.0], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var waypoints = [
    { name: "Day 1 – Karachi to Makli Necropolis and Hyderabad", lat: 24.8607, lon: 67.0011 },
    { name: "Day 2 – Hyderabad to Mohenjo-Daro and Sukkur", lat: 25.3960, lon: 68.3578 },
    { name: "Day 3 – Sukkur to Bahawalpur", lat: 27.7052, lon: 68.8574 },
    { name: "Day 4 – Bahawalpur to Multan", lat: 29.3956, lon: 71.6836 },
    { name: "Day 5 – Multan to Lahore", lat: 30.1575, lon: 71.5249 },
    { name: "Day 6 – Lahore Full Day 1 (Lahore Fort, Wazir Khan Mosque, and Shalimar Gardens)", lat: 31.5883, lon: 74.3105 },
    { name: "Day 7 – Lahore Full Day 2 (Culture and Culinary Experiences)", lat: 31.5204, lon: 74.3587 },
    { name: "Day 8 – Lahore to Rohtas Fort (Optional) and Islamabad", lat: 33.6844, lon: 73.0479 },
    { name: "Day 9 – Islamabad and Optional Taxila Visit", lat: 33.7000, lon: 73.0500 },
    { name: "Day 10 – Islamabad", lat: 33.6844, lon: 73.0479 },
    { name: "Day 11 – Airport Transfer for International departure", lat: 33.5603, lon: 72.8516 }
  ];

  waypoints.forEach(function(waypoint) {
    L.marker([waypoint.lat, waypoint.lon]).addTo(map)
      .bindTooltip(waypoint.name, { permanent: true, className: 'waypoint-tooltip' })
      .openTooltip();
  });

  var routeLine = waypoints.map(wp => [wp.lat, wp.lon]);
  var routePath = L.polyline(routeLine, { color: 'blue', weight: 4 }).addTo(map);
  map.fitBounds(routePath.getBounds(), { padding: [60, 60] });

  map.addControl(new L.Control.Fullscreen());
</script>

<style>
  .waypoint-tooltip {
    border: 1px solid #0078A8;
    padding: 5px;
    font-size: 10px;
    font-weight: bold;
    color: #0078A8;
    opacity: 0.8;
  }

  @media (max-width: 768px) {
    #map {
      height: 4000vh;
    }
  }
</style>
